[project]
name = "rate-limiter-client"
version = "1.2.0"
description = "Python client for RateFlow (rate-limiter-service). Supports direct use and OpenAPI generated clients."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["requests"]

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
